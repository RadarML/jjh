[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jjh"
version = "0.1.0"
authors = [
  { name="Tianshu Huang", email="tianshu2@andrew.cmu.edu" },
]
description = "Tooling for using a jj workflow on github."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

dependencies = [
    "tyro >= 1.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit >= 4.0.0",
    "pytest >= 8.0.0",
    "coverage",
    "pytest-cov",
    "pyright >= 1.0.0",
    "ruff >= 0.11.0",
]
docs = [
    "zensical >= 0.1.1",
    "mkdocstrings-python >= 2.0.11",
    "mkdocstrings-python-xref >= 2.1.1",
    "ruff >= 0.11.0",
]

[project.scripts]
jjh = "jjh.cli:main"

[project.urls]
Homepage = "https://github.com/RadarML/jjh"
Documentation = "https://radarml.github.io/jjh"
Issues = "https://github.com/RadarML/jjh/issues"

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E", "F", "W", "N", "I", "D"
]
ignore = [
    "D102",  # Inheriting docstrings is allowed
    "D107",  # Initializer goes in the class docstring
    "D105",  # Magic methods are self-explanatory
    "D401",  # "Imperative mood" NLP doesn't always make sense
    "D413",  # No blank lines after section is preferred by mkdocstrings

    # Must pick one...
    "D213",  # Pick 'multi-line-summary-first-line'.
    "D203",  # Pick `no-blank-line-before-class`.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.coverage.report]
exclude_also = [
    '^\s*\.\.\.\s*$',
    'def __repr__',
    'if __name__ == .__main__.:',
    'class .*\bProtocol\):',
    'raise NotImplementedError',
]
