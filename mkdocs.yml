site_name: jjh
site_url: https://radarml.github.io/jjh
repo_url: https://github.com/RadarML/jjh
repo_name: RadarML/jjh
# Zensical only tracks mkdocstrings sources for the `python` handler, not
# `python_xref`; without this, docstring edits don't rebuild or invalidate pages.
watch:
- src
nav:
  - Home: index.md
  - CLI Reference: cli.md
  - Development: develop.md

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  variant: classic
  icon:
    logo: material/source-branch
    annotation: material/arrow-right-circle
  font:
    code: monospace
  features:
    - navigation.instant
    - navigation.expand
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: blue
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: indigo
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to system preference

plugins:
- search
- autorefs
- llmstxt:
    full_output: llms-full.txt
    markdown_description: |
      `jjh` is a command line tool for using a jj (jujutsu) workflow on github.
    sections:
      "jjh":
      - index.md: Project overview and installation
      - cli.md: Command line reference for each `jjh` subcommand
      - develop.md: Development environment setup, testing, and documentation
- mkdocstrings:
    default_handler: python_xref
    handlers:
      python_xref:
        paths: [src]
        options:
          docstring_style: google
          relative_crossrefs: true
          separate_signature: true
          line_length: 80
          show_signature_annotations: true
          signature_crossrefs: true
          show_root_full_path: true
          show_root_members_full_path: true
          show_symbol_type_heading: true
          show_root_heading: true
          show_root_toc_entry: true
          heading_level: 1
          filters:
          - "!^_[^_]"  # mkdocstrings default: hide private members
        inventories:
        - https://docs.python.org/3/objects.inv

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - footnotes
