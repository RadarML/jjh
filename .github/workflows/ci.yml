name: Run CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install jj
      env:
        JJ_VERSION: "0.47.1"
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" ./jj
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/jj" --version

    - name: Install dependencies
      run: |
        uv sync --extra dev --frozen

    - name: Lint with ruff
      run: |
        uv run --extra dev ruff check ./src ./tests

    - name: Type check with pyright
      run: |
        uv run --extra dev pyright ./src

    - name: Run tests
      run: |
        uv run --extra dev pytest -ra -- tests

    - name: Check tool install
      run: |
        uv tool install . && jjh version
